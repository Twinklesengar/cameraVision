<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1019"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="url(#bg)"/>
  <text x="600" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#f8fafc">Deployment Topology</text>
  <text x="600" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">Runs as a single Docker Compose stack — one box is enough for a small office</text>

  <!-- Clients -->
  <g>
    <rect x="40" y="100" width="320" height="120" rx="12" fill="#0e1522" stroke="#334155"/>
    <text x="60" y="128" font-size="13" font-weight="700" fill="#f8fafc">Clients</text>
    <g font-size="11" fill="#94a3b8">
      <text x="60" y="152">Browser dashboard (Tailwind SPA)</text>
      <text x="60" y="172">operator · admin · HR</text>
      <text x="60" y="192">Telegram chat · JSON webhook</text>
    </g>
  </g>
  <line x1="360" y1="160" x2="462" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="411" y="152" text-anchor="middle" font-size="10" fill="#475569">HTTP / WS</text>

  <!-- Host -->
  <g>
    <rect x="466" y="78" width="330" height="500" rx="14" fill="#101720" stroke="#1e293b"/>
    <rect x="466" y="78" width="330" height="36" rx="14" fill="#101720"/>
    <text x="631" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">AegisVision host · single box</text>

    <rect x="488" y="128" width="286" height="54" rx="8" fill="#141d2e" stroke="#22d3ee"/>
    <text x="506" y="148" font-size="11.5" fill="#67e8f9">NGINX · TLS reverse proxy</text>
    <text x="506" y="166" font-size="10.5" fill="#64748b">static files + /api routing</text>

    <rect x="496" y="196" width="270" height="70" rx="8" fill="#141d2e" stroke="#818cf8"/>
    <text x="514" y="218" font-size="11.5" font-weight="700" fill="#c7d2fe">uvicorn</text>
    <text x="514" y="232" font-size="10.5" fill="#64748b">main worker + match workers</text>
    <text x="514" y="248" font-size="10.5" fill="#64748b">REST + WS + MJPEG stream</text>

    <rect x="496" y="282" width="270" height="94" rx="8" fill="#141d2e" stroke="#34d399"/>
    <text x="514" y="304" font-size="11.5" font-weight="700" fill="#6ee7b7">Persistent volumes</text>
    <g font-size="10.5" fill="#94a3b8">
      <text x="514" y="324">data/surveillance.db (SQLite)</text>
      <text x="514" y="340">data/vector_db (ChromaDB)</text>
      <text x="514" y="356">data/known_persons (roster)</text>
      <text x="514" y="372">data/logs (rotating)</text>
    </g>

    <rect x="496" y="392" width="270" height="56" rx="8" fill="#141d2e" stroke="#a78bfa"/>
    <text x="514" y="414" font-size="11.5" fill="#c4b5fd">ONNX models (~/.insightface)</text>
    <text x="514" y="431" font-size="10.5" fill="#64748b">SCRFD detect + ArcFace embed</text>
  </g>

  <!-- Edge -->
  <g>
    <rect x="850" y="78" width="310" height="190" rx="12" fill="#0e1522" stroke="#334155"/>
    <text x="1005" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">Edge inputs</text>
    <g font-size="10.5" fill="#94a3b8">
      <text x="870" y="132">RTSP IP cameras</text>
      <text x="870" y="152">USB / MJPEG webcams</text>
      <text x="870" y="172">hardware encoders</text>
    </g>
    <rect x="870" y="196" width="268" height="50" rx="8" fill="#141d2e" stroke="#22d3ee"/>
    <text x="1004" y="218" text-anchor="middle" font-size="11" fill="#67e8f9">streams in</text>
    <text x="1004" y="234" text-anchor="middle" font-size="10" fill="#475569">RTSP / MJPEG / HLS</text>
  </g>
  <path d="M850 160 L798 160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="820" y="152" text-anchor="middle" font-size="10" fill="#475569">feed</text>

  <!-- External APIs -->
  <g>
    <rect x="850" y="330" width="310" height="150" rx="12" fill="#0e1522" stroke="#334155"/>
    <text x="1005" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">External APIs</text>
    <g font-size="11" fill="#94a3b8">
      <text x="870" y="384">Google Generative AI (Gemini)</text>
      <text x="870" y="406">Telegram Bot API</text>
      <text x="870" y="428">JSON push webhooks</text>
    </g>
  </g>
  <path d="M631 578 L631 332" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrV)"/>
  <text x="641" y="470" font-size="10" fill="#7c3aed">copilot + push</text>
</svg>